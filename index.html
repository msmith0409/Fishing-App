<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fishing Planner</title>
  <meta name="theme-color" content="#14532d">
  <meta name="description" content="Personal fishing planner and catch log for Missouri lakes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Fishing Planner</h1>
    <span id="offline" class="pill" hidden>offline</span>
  </header>
  <main id="main"><p class="muted pad">Loading…</p></main>
  <nav class="tabs" aria-label="Sections">
    <a href="#plan" data-r="plan"><span aria-hidden="true">🌤</span>Plan</a>
    <a href="#log" data-r="log"><span aria-hidden="true">🎣</span>Log</a>
    <a href="#stats" data-r="stats"><span aria-hidden="true">📊</span>Stats</a>
    <a href="#more" data-r="more"><span aria-hidden="true">⚙</span>More</a>
  </nav>
  <dialog id="sheet"></dialog>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
